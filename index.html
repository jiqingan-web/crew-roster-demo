<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机组排班助手 · Crew Rostering Assistant</title>
<link rel="stylesheet" href="css/style.css?v=614">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✈</span><div><div class="t1">机组智能排班助手</div><div class="t2">空客+C909 · 11中队 · 成都基地 · 2026年11月 · <a href="lite/" style="color:inherit">轻量版 ↗</a></div></div><span class="sample-tag">示例数据 SAMPLE</span></div>
  <div class="actions">
    <div class="issue-wrap">
      <button id="btnIssues" class="btn warn" type="button" title="定位缺人与硬性违规">⚠ 定位问题<span id="issueBadge" class="ibadge hidden">0</span></button>
      <div id="issuePanel" class="issue-panel hidden" role="dialog" aria-label="问题列表"></div>
    </div>
    <button id="btnAuto" class="btn primary">⚡ 一键自动填人</button>
    <button id="btnClear" class="btn">清空排班</button>
    <button id="btnReset" class="btn danger">重置示例数据</button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="data" title="主线①">导入导出</button>
  <button data-tab="gantt" class="active">人员视图</button>
  <button data-tab="tasks">任务视图</button>
  <button data-tab="leave" title="主线④">请假调配</button>
  <button data-tab="report">校验报告</button>
  <button data-tab="ops">运营看板</button>
  <button data-tab="duty">执勤监控</button>
  <div class="more" id="moreWrap">
    <button type="button" id="btnMore" class="more-btn" aria-haspopup="true" aria-expanded="false">更多功能 ▾</button>
    <div class="more-panel hidden" id="morePanel" role="menu">
      <button data-tab="roster">人员总览</button>
      <button data-tab="welfare">员工福利</button>
      <button data-tab="fills">补位历史</button>
      <button data-tab="rules">规则库</button>
      <button data-tab="settings">设置</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
</nav>
<section class="story" id="story" aria-label="主线流程"></section>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="progress" class="progress hidden"><div class="pbox"><div class="ptitle">正在自动排班（多轮优化 + 备份编排）…</div><div class="pbar"><div id="pfill"></div></div><div id="ptext">0%</div></div></div>
<div id="tip" class="tip hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="js/vendor/jszip.min.js"></script>
<script src="js/vendor/exceljs.min.js"></script>
<script src="js/xlsx-gantt.js?v=614"></script>
<script src="js/sample-data.js"></script>
<script src="js/lite-roster.js"></script>
<script src="js/rules-config.js"></script>
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js?v=614"></script>
</body>
</html>
